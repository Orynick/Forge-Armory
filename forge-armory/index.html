<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- FR : ⚠️ AJOUT (15/09/2026) - favicon, absent jusqu'ici (onglet de
    navigateur affichant l'icône générique par défaut). Historique : icône du
    Spectre (15/09/2026), puis papillon seul depuis le 01/10/2026 (v0.3.0).
    EN: ⚠️ ADDED - favicon. History: Ghost icon (15/09/2026), then the
    butterfly alone since 01/10/2026 (v0.3.0). -->
    <!-- FR : ⚠️ CHANGÉ (01/10/2026, v0.3.0) - NOUVEAU LOGO (Forge Armory, à tester,
    demande de l'utilisateur) : le favicon devient le PAPILLON SEUL, en PNG de
    16, 32 et 48 px (le logo complet avec cercle et losanges est illisible à
    16 px ; voir ressources-installateur/forge-armory/LISEZ-MOI.md). Fond noir
    conservé : lisible sur un onglet clair comme sombre. L'ANCIEN favicon
    (Spectre) est conservé dans ressources-installateur/forge-armory/archives-precedentes/ancien-logo/ avec la
    marche à suivre pour y revenir.
    EN: ⚠️ CHANGED - NEW LOGO favicon: the butterfly alone, in 16/32/48 px PNG.
    The OLD favicon is kept in ressources-installateur/forge-armory/archives-precedentes/ancien-logo/. -->
    <!-- FR : ⚠️ CHANGÉ (23/10/2026, demande de l'utilisateur : « il faut utiliser le nouveau logo ») - le favicon n'est PLUS le papillon seul : c'est l'ICÔNE D'APPLICATION de la planche de déclinaisons (tuile sombre arrondie portant l'emblème complet), la même que l'icône Windows, en PNG de 16, 32 et 48 px, régénérée par ressources-installateur/forge-armory/generer-icones.py depuis le nouveau logo du kit. Le papillon seul reste disponible (ressources-installateur/forge-armory/declinaisons/papillon-seul-256.png) si le 16 px est jugé illisible.
    EN: ⚠️ CHANGED - the favicon is now the application icon (dark rounded tile with the full emblem), same as the Windows icon, regenerated from the new logo. -->
    <!-- FR : ⚠️ CORRIGÉ (06/11/2026, branche draft-netlify) - chemins de favicon via
         %BASE_URL% : relatif pour Electron ("./"), absolu sur Netlify ("/") - un chemin
         relatif figé cassait l'icône d'onglet sur les sous-pages web (/auth/callback).
         EN: favicon paths via %BASE_URL%: relative for Electron, absolute on Netlify -
         a fixed relative path broke the tab icon on web sub-pages. -->
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="%BASE_URL%favicon-48.png" />
    <title>Forge Armory — Destiny 2 Build Analyzer</title>
    <!-- FR : ⚠️ AJOUT (23/11/2026, branche draft-apercu-lien-og) - aperçu de lien
    (Open Graph) STATIQUE : méta og:* + twitter:card + image fixe
    public/og-image.png (1200x630, logo complet sur fond noir). Zéro coût
    Netlify : servi tel quel par le CDN, aucune fonction, aucun prerendering.
    Les scrapers (Discord, Slack, Facebook, agents IA) exigent une URL
    ABSOLUE pour og:image : on hardcode donc https://forge-armory.orynick.fr
    (à remettre à jour en cas de changement de domaine, voir
    documentation/GUIDE-MISE-EN-LIGNE.md §3). Le build Electron hérite des
    balises sans effet (rien ne scrape un fichier local).
    EN: ⚠️ ADDED (2026-11-23, branch draft-apercu-lien-og) - STATIC link
    preview (Open Graph): og:* meta tags + twitter:card + fixed image
    public/og-image.png (1200x630, full logo on black). Zero Netlify cost:
    served as-is by the CDN, no function, no prerendering. Scrapers require
    an ABSOLUTE URL for og:image, hence the hardcoded
    https://forge-armory.orynick.fr (update on domain change, see
    documentation/GUIDE-MISE-EN-LIGNE.md §3). The Electron build inherits
    the tags harmlessly (nothing scrapes a local file). -->
    <meta name="description" content="Analyseur de builds Destiny 2 : scorez votre build sur 5 piliers à partir de vos données Bungie.net, en ligne ou en application Windows." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Forge Armory" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Forge Armory — Destiny 2 Build Analyzer" />
    <meta property="og:description" content="Analysez votre build Destiny 2 (5 piliers) depuis vos données Bungie.net — en ligne ou en application Windows." />
    <meta property="og:url" content="https://forge-armory.orynick.fr" />
    <meta property="og:image" content="https://forge-armory.orynick.fr/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo Forge Armory — Destiny 2 Build Analyzer" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
