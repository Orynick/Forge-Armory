    </linearGradient>
    <filter id="fa-icones-icone-statistiques-glow" x="-150%" y="-30%" width="400%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fa-icones-icone-statistiques-glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <linearGradient id="fa-icones-icone-statistiques-plateFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131923"/><stop offset="1" stop-color="#080b11"/>
    </linearGradient>
    <linearGradient id="fa-icones-icone-statistiques-fadeH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8ebef" stop-opacity="0"/><stop offset="0.12" stop-color="#e8ebef" stop-opacity="0.85"/>
      <stop offset="0.88" stop-color="#e8ebef" stop-opacity="0.85"/><stop offset="1" stop-color="#e8ebef" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fa-icones-icone-statistiques-fadeV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8ebef" stop-opacity="0"/><stop offset="0.25" stop-color="#e8ebef" stop-opacity="0.7"/>
      <stop offset="0.75" stop-color="#e8ebef" stop-opacity="0.7"/><stop offset="1" stop-color="#e8ebef" stop-opacity="0"/>
    </linearGradient>
