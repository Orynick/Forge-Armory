<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="fa-icones-icone-statistiques-title">
  <title id="fa-icones-icone-statistiques-title">Forge Armory — 5. Statistiques (icône)</title>
  <defs>
    <linearGradient id="fa-icones-icone-statistiques-silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d9dde2"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="fa-icones-icone-statistiques-silverText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#d4d9df"/>
      <stop offset="1" stop-color="#f2f4f6"/>
    </linearGradient>
    <linearGradient id="fa-icones-icone-statistiques-cyanL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ff3ff"/>
      <stop offset="1" stop-color="#1cc6ff"/>
    </linearGradient>
    <linearGradient id="fa-icones-icone-statistiques-cyanR" x1="0" y1="0" x2="1" y2="1">
