      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g shape-rendering="geometricPrecision">
    <circle cx="512" cy="512" r="436" fill="none" stroke="url(#fa-icones-icone-statistiques-silver)" stroke-width="22"/>
    <path d="M 340 570 L 390 570 L 400 580 L 400 680 L 390 690 L 340 690 L 330 680 L 330 580 Z M 438 490 L 488 490 L 498 500 L 498 680 L 488 690 L 438 690 L 428 680 L 428 500 Z M 536 400 L 586 400 L 596 410 L 596 680 L 586 690 L 536 690 L 526 680 L 526 410 Z " fill="url(#fa-icones-icone-statistiques-silver)"/><g filter="url(#fa-icones-icone-statistiques-glowSoft)"><path d="M 634 310 L 684 310 L 694 320 L 694 680 L 684 690 L 634 690 L 624 680 L 624 320 Z" fill="url(#fa-icones-icone-statistiques-cyanL)"/></g><path d="M 306 708 L 718 708 L 724 714 L 724 720 L 718 726 L 306 726 L 300 720 L 300 714 Z" fill="url(#fa-icones-icone-statistiques-silver)"/>
    
