<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">Forge Armory — Contexte Du Build (icône)</title>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d9dde2"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="silverText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#d4d9df"/>
      <stop offset="1" stop-color="#f2f4f6"/>
    </linearGradient>
    <linearGradient id="cyanL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ff3ff"/>
      <stop offset="1" stop-color="#1cc6ff"/>
    </linearGradient>
    <linearGradient id="cyanR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00aef5"/>
      <stop offset="1" stop-color="#0078d0"/>
    </linearGradient>
    <filter id="glow" x="-150%" y="-30%" width="400%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <linearGradient id="plateFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131923"/><stop offset="1" stop-color="#080b11"/>
    </linearGradient>
    <linearGradient id="fadeH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8ebef" stop-opacity="0"/><stop offset="0.12" stop-color="#e8ebef" stop-opacity="0.85"/>
      <stop offset="0.88" stop-color="#e8ebef" stop-opacity="0.85"/><stop offset="1" stop-color="#e8ebef" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8ebef" stop-opacity="0"/><stop offset="0.25" stop-color="#e8ebef" stop-opacity="0.7"/>
      <stop offset="0.75" stop-color="#e8ebef" stop-opacity="0.7"/><stop offset="1" stop-color="#e8ebef" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowStar" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g shape-rendering="geometricPrecision">
    <circle cx="512" cy="512" r="436" fill="none" stroke="url(#silver)" stroke-width="22"/>
    <g transform="translate(0 27)"><g filter="url(#glowSoft)"><path d="M 512 300 L 742 395 L 512 490 L 282 395 Z" fill="url(#cyanL)"/></g><path d="M 282 455 L 512 550 L 742 455 L 742 487 L 512 582 L 282 487 Z" fill="url(#silver)"/><path d="M 282 547 L 512 642 L 742 547 L 742 579 L 512 674 L 282 579 Z" fill="url(#silver)"/></g>
    
  </g>
