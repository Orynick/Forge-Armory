  <g shape-rendering="geometricPrecision">
    <circle cx="512" cy="512" r="436" fill="none" stroke="url(#silver)" stroke-width="22"/>
    <g transform="translate(512 512) scale(1.4) translate(-512 -512)"><path d="M 512 308 C 590 308 650 356 652 440 L 656 540 L 628 612 L 584 668 L 544 716 L 512 716 L 480 716 L 440 668 L 396 612 L 368 540 L 372 440 C 374 356 434 308 512 308 Z" fill="url(#silver)" mask="url(#mHelm)"/><g filter="url(#glowSoft)"><path d="M 410 446 L 614 446 L 596 488 L 536 488 L 536 596 L 512 626 L 488 596 L 488 488 L 428 488 Z" fill="url(#cyanL)"/></g></g>
    
  </g>
