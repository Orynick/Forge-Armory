  <title id="fa-panneaux-titre-solo-sans-mourir-title">Forge Armory — titre « Solo sans mourir »</title>
  <desc id="fa-panneaux-titre-solo-sans-mourir-desc">Titre de panneau : écu à herse en argent, une fenêtre allumée en cyan, dans un cercle ; plaque compacte avec le titre SOLO SANS MOURIR, soulignage et étoile cyan.</desc>
