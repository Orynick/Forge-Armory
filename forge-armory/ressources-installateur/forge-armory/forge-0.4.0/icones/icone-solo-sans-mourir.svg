  <title id="fa-icones-icone-solo-sans-mourir-title">Forge Armory — icône Solo sans mourir</title>
  <desc id="fa-icones-icone-solo-sans-mourir-desc">Titre de panneau : écu à herse en argent, une fenêtre allumée en cyan, dans un cercle ; plaque compacte avec le titre SOLO SANS MOURIR, soulignage et étoile cyan.</desc>
