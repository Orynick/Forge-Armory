  <title id="fa-icones-icone-forge-title">Forge Armory — icône Forge</title>
  <desc id="fa-icones-icone-forge-desc">Lame cyan dressée dans un anneau d'argent au-dessus d'une enclume, dans un cercle, cristaux cyan en haut et en bas ; plaque avec le titre FORGE, soulignage et étoile cyan.</desc>
