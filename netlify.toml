# FR : Configuration Netlify pour le dépôt Forge-Armory. Le site Netlify est
# l'APPLI NAVIGATEUR uniquement (les scripts Electron et l'installateur
# Windows n'ont rien à faire sur un hébergeur web). Le projet React+Vite est
# dans le sous-dossier forge-armory/. En production (branche main) et sur les
# aperçus, la page a besoin de ses variables Bungie : définissez
# VITE_BUNGIE_API_KEY, VITE_BUNGIE_CLIENT_ID et VITE_BUNGIE_REDIRECT_URI dans
# Site configuration > Environment variables (pas dans ce fichier, qui est
# public : aucune clé ici). L'URI de redirection doit être enregistrée aussi
# dans votre application Bungie (https://www.bungie.net/en/Application).
# EN: Netlify configuration for the Forge-Armory repo. Deploys the BROWSER
# app only. Build vars for Bungie go in the Netlify UI, never in this file.

[build]
  base = "forge-armory"
  # FR : ⚠️ PROVISOIRE - la commande officielle `npm run build` exécute
# `tsc -b && vite build`, mais `tsc` échoue depuis la v0.4.11 sur
# BadgeSaison.tsx (imports inexistants, voir CHANGELOG du 18/10). Tant que ce
# défaut n'est pas corrigé, on lance `vite build` seul, qui produit le même
# dossier dist sans l'étape de typage. REVENIR à `npm run build` une fois le
# typage réparé (vérification TypeScript rétablie dans le déploiement).
# EN: ⚠️ TEMPORARY - `npm run build` runs `tsc -b && vite build`, but `tsc`
# has failed since v0.4.11 on BadgeSaison.tsx (missing imports, see the
# 18/10 CHANGELOG). Until that is fixed, build with `vite build` alone,
# which produces the same dist folder. Restore `npm run build` once the
# TypeScript check is fixed.
command = "npx vite build"
  publish = "dist"

# FR : le build Vite n'émet qu'un seul index.html ; sans cette règle, tout
# rafraîchissement sur /auth/callback (retour OAuth Bungie) renverrait la
# page d'erreur « Page not found » de Netlify.
# EN: SPA fallback: Vite emits a single index.html, so /auth/callback
# (Bungie OAuth return) must serve it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
